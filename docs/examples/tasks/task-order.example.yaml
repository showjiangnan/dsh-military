taskType: repository-reconnaissance
assignedRole: worker
complexity:
  semanticDecisions: 2
  unknownDependencies: 2
  writeDomains: 0
  toolFamilies: 2
  acceptanceAmbiguity: 1
  integrationFanOut: 2
  contextFootprint: small
scope:
  readPaths:
    - src/**
    - test/**
    - package.json
  writePaths: []
  forbiddenPaths:
    - .env*
    - node_modules/**
allowedTools:
  - fs_search
  - fs_read
  - bash
requiredEvidence:
  - 真实文件路径与关键代码位置
  - 测试命令或测试夹具位置
acceptance:
  contractId: ac-repository-recon
  version: 1
dependencies: []
tactics:
  - skillId: tactic-codebase-auth-recon
    version: 1.2.0
    usageStage: assigned
environmentSnapshotRef: env-snapshot-20260818-001
stopConditions:

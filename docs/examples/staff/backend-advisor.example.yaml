schemaVersion: 1.0.0
advisorId: advisor-web-backend
revision: 1
displayName: Web 后端参谋
status: ACTIVE
description: 负责服务端 API、数据访问、鉴权和可观测性战术指导。
responsibilities:
  - REST/GraphQL API 设计与实现规划
  - 数据访问和事务边界
  - 鉴权、权限和服务端测试
nonResponsibilities:
  - 视觉设计
  - 生产环境部署批准
  - 远端 Git 写入
domains:
  - web-backend
  - api
  - database
  - authorization
scenarioTags:
  - typescript
  - nodejs
  - read-api
modelPolicy:
  provider: deepseek-official
  model: deepseek-v4-pro
  reasoningEffort: high
  maxTokens: 64000
  fallbackProfiles: []
permissions:
  tools:
    - military_staff_read_mission
    - military_staff_retrieve_tactics
    - military_staff_issue_guidance

      methods:
        - GET
      resourcePatterns:
        - /catalog/apis/*
      classificationCeiling: internal
      credentialRef: cred-enterprise-catalog-read
      rateLimitPerMinute: 30
      responseRedactionPolicy: redact-secrets-v1
  dataClassificationCeiling: confidential
  secretCredentialRefs:
    - cred-enterprise-catalog-read
budgets:
  maxConcurrentConsultations: 2
  maxRequestsPerMission: 20
  maxGuidancePerTask: 3
routing:
  priority: 80
  costWeight: 0.2
  latencyWeight: 0.2
  qualityWeight: 0.6
